version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: speechsync-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: production_password
      POSTGRES_DB: speechsync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: speechsync-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:production_password@db:5432/speechsync?schema=public
      - JWT_SECRET=your_jwt_secret_here
      - GROQ_API_KEY=your_groq_api_key_here
      - GROQ_MODEL=llama-3.3-70b-versatile
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/status"]
      interval: 15s
      timeout: 5s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: speechsync-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata:
